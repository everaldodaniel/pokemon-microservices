
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

resilience4j.circuitbreaker.instances.pokemonDetails.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.pokemonDetails.sliding-window-size=8

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

clients.pokemon-details.url=${POKEMON_DETAILS_URL}

server.port=${SERVER_PORT}

management.endpoints.access.default=none
management.endpoint.health.access=read_only
management.endpoint.info.access=read_only
management.endpoint.prometheus.access=read_only
management.endpoints.web.exposure.include=health,info,prometheus


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
